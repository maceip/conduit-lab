[package]
name = "vjs_vm"
version = "0.1.0"
edition = "2021"
description = "Verified JS subset bytecode compiler and stack VM with CompCert-style simulation proof"
license = "MIT"

[dependencies]
vstd = { workspace = true }

[dev-dependencies]
serde_json = "1"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
