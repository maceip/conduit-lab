<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig 5 — Ignition · 24V Starter Motor & Bytecode Rail</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3e4347; --detail:#2a2d30; --body:#17181a; --deck:#1c1e21;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --kn:#232629; --kn-line:#565b5f; --ko:#d9dcde; --ko-line:#5a5f63; --ko-ink:#141618;
    --glass:#0a0b0c;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px; }
  html[data-embed="1"] body { background:transparent; padding:0; }
  html[data-embed="1"] main { max-width:none; }
  html[data-embed="1"] .foot-help { display:none; }
  html[data-embed="1"] svg { aspect-ratio: 6 / 5; }
  html[data-compact="1"] figure { padding:12px 14px; border-radius:12px; }
  html[data-compact="1"] .cap { font-size:10.5px; letter-spacing:.09em; }
  main { max-width:820px; margin-inline:auto; display:grid; gap:12px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:20px 24px; display:grid; gap:6px; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.13em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.04em; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  svg:focus-visible { outline:2px solid var(--live); outline-offset:4px; border-radius:8px; }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .struct { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .live-stroke { fill:none; stroke:var(--live); stroke-width:1.25; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .glass { fill:var(--glass); }
  .lcd { fill:var(--live); font-family:var(--mono); }
  .lcd-dim { fill:var(--ink); font-family:var(--mono); }
  .lbl { fill:var(--ink); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .lbl-hi { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press .face { fill:var(--kn); stroke:var(--kn-line); transition:stroke 90ms, fill 90ms; }
  .press.op .face { fill:var(--ko); stroke:var(--ko-line); }
  .press text { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press.op text { fill:var(--ko-ink); }
  .press.down { transform:translateY(4px); }
  .press.down .face, .press:hover .face.top, .press.sel .face { stroke:var(--live); }
  .press.sel text { fill:var(--live); }
  .press.op.sel text { fill:var(--ko-ink); }
  .unit { transition:transform 160ms cubic-bezier(.22,.8,.24,1); }
  .unit .face { transition:stroke 120ms, fill 120ms; }
  .unit.lit .face { stroke:var(--live); }
  .unit.lit .face.top { fill:var(--ko); }
  .unit.lit .lbl-hi { fill:var(--live); }
  .unit.lit .top-lbl { fill:var(--ko-ink); }
  .top-lbl { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .unit.mid .face { stroke:var(--kn-line); }
  .foot-help { margin:0; max-width:68ch; line-height:1.6; font-size:12px; }
  kbd { font:inherit; color:var(--ink-hi); border:1px solid var(--edge); border-radius:4px; padding:0 4px; }
  @media (prefers-reduced-motion:reduce){ .press, .unit { transition:none !important; } }
  
</style>
</head>
<body>
<main>
  <figure class="iso-plate">
    <div class="cap"><span class="hi">Fig 5</span><span>Ignition · 24V Starter Motor & Bytecode Rail</span></div>
    <svg id="stage" viewBox="0 0 628 524" tabindex="0" role="img" aria-label="Isometric 24V electric starter motor with cooling fins and piggyback solenoid driving a four-injector common bytecode fuel rail for V8 Ignition."></svg>
    <div class="cap"><span>crank 24v · step bytecode injectors 1-4</span><span class="hi" id="readout" data-readout>24v cranked · inj #2 Add · acc 43 · warm 1</span></div>
  </figure>
  <p class="foot-help">Keys: <kbd>C</kbd> crank 24V starter · <kbd>Space</kbd> step bytecode injector · <kbd>1</kbd>–<kbd>4</kbd> fire injector (<code>LdaSmi</code>, <code>Add</code>, <code>Star r0</code>, <code>Return</code>) · <kbd>K</kbd> cut ignition.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.documentElement.setAttribute("data-embed", "1");
  if (params.get("compact") === "1") document.documentElement.setAttribute("data-compact", "1");
  const qt = params.get("theme");
  if (qt === "light" || qt === "dark") document.documentElement.setAttribute("data-theme", qt);
  else document.documentElement.setAttribute("data-theme", "dark");
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "v8-iso-theme" && (ev.data.theme === "light" || ev.data.theme === "dark")) {
      document.documentElement.setAttribute("data-theme", ev.data.theme);
    }
  });
  if (params.get("embed") === "1" && window.parent && window.parent !== window) {
    const postH = () => {
      const f = document.querySelector("figure");
      if (f) window.parent.postMessage({ type: "v8-iso-height", id: params.get("id") || "fig-05-ignition", height: Math.ceil(f.getBoundingClientRect().height) }, "*");
    };
    new ResizeObserver(postH).observe(document.body);
    window.addEventListener("load", postH);
    setTimeout(postH, 60);
  }
})();

// ---- iso kernel (verbatim MrBongoC/ai-iso-skill) ----
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6), OX = 236, OY = 178;
const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V); return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
const TOP = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
const SIDE = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
const box = (x,y,z,w,d,h,r=0) => rect(SIDE(x+w,y+d,z+h),d,h,Math.min(r,h/4)) + rect(FRONT(x,y+d,z+h),w,h,Math.min(r,h/4)) + rect(TOP(x,y,z+h),w,d,r,'face top');


let svg = '';
// 1. Engine Bed & Cradle Base (388 x 208 x 16)
svg += box(0, 0, 0, 388, 208, 16, 5);

// 2. Back-Right 24V ECU & Accumulator Telemetry Panel (x = 160, y = 8, z = 16..118)
svg += box(160, 8, 16, 214, 34, 102, 4);
svg += `<g transform="${FRONT(160, 42, 118)}">
  <defs><clipPath id="igScr"><rect x="10" y="9" width="194" height="54" rx="4"/></clipPath></defs>
  <rect class="face glass" x="10" y="9" width="194" height="54" rx="4"/>
  <g clip-path="url(#igScr)">
    <text id="igVolt" class="lcd" x="16" y="22" font-size="8.5">24.2V BUS · RAIL 380 kPa · PC=0x02</text>
    <text id="igOp" class="lcd-dim" x="16" y="36" font-size="8.2">OP: Add r0, [feedback #0]</text>
    <text id="igRegs" class="lcd" x="16" y="50" font-size="8.5">acc = 43 · r0 = 42 · warm = 1</text>
  </g>
</g>`;

// 3. Left Horizontal 24V Electric Starter Motor + Solenoid (x = 16..148, y = 46..126)
svg += box(24, 54, 16, 108, 62, 16, 2); // motor saddle mount
svg += `<g class="unit" id="starterMotor">
  ${box(16, 46, 32, 122, 78, 60, 8)}
  <!-- 10 axial stator cooling fins on TOP and FRONT -->
  <g transform="${TOP(16, 46, 92)}">
    ${Array.from({length:9},(_,i)=>`<path class="detail" d="M${16+i*11} 8v62"/>`).join('')}
  </g>
  <g transform="${FRONT(16, 124, 92)}">
    ${Array.from({length:9},(_,i)=>`<path class="detail" d="M${16+i*11} 8v44"/>`).join('')}
  </g>
  <!-- Piggyback 24V Starter Solenoid on top of motor -->
  ${box(32, 58, 92, 84, 46, 26, 6)}
  <g transform="${FRONT(32, 104, 118)}"><text class="lbl-hi" x="42" y="16" font-size="7.5">24V SOLENOID</text></g>
  <!-- Drive Pinion Nose Cone engaging rail pump -->
  ${box(138, 68, 48, 18, 34, 28, 4)}
</g>`;

// 4. Intake Runner Manifold Block + 4 Bytecode Fuel Injectors + Common Fuel Rail (x = 158..374, y = 56..126)
svg += box(158, 54, 16, 214, 72, 34, 4); // lower intake manifold
const INJS = [
  ['LdaSmi', 172],
  ['Add', 222],
  ['Star r0', 272],
  ['Return', 322]
];
INJS.forEach(([lbl, ix], i) => {
  // Intake port boss + vertical stepped fuel injector body
  svg += box(ix + 4, 72, 50, 26, 32, 12, 3);
  svg += `<g class="unit" id="inj${i}">
    ${box(ix, 68, 62, 34, 40, 28, 5)}
    <g transform="${FRONT(ix, 108, 90)}"><text x="17" y="17" font-size="6.8" class="lbl-hi">${lbl}</text></g>
  </g>`;
});
// Elevated Common Bytecode Fuel Rail spanning across top of all 4 injectors (z = 90..108)
svg += box(154, 72, 90, 222, 32, 16, 5);
svg += `<g transform="${TOP(154, 72, 106)}">
  <path class="detail" d="M12 16h198"/>
  <text class="lbl-hi" x="111" y="12" font-size="7.2">COMMON BYTECODE RAIL</text>
</g>`;

// 5. Front Operator Switchgear Manifold (y = 148..194)
const BTNS = [
  ['crank', 'CRANK 24V', 18, 72, true],
  ['step', 'STEP OP', 96, 64, true],
  ['i0', '1:LDA', 166, 46, false],
  ['i1', '2:ADD', 218, 46, false],
  ['i2', '3:STAR', 270, 48, false],
  ['cut', 'CUT', 324, 48, false]
];
BTNS.forEach(([id, lbl, bx, bw, op]) => {
  svg += `<g class="press${op?' op':''}" data-k="${id}">${box(bx, 152, 16, bw, 36, 8, 3)}<g transform="${TOP(bx, 152, 24)}"><text x="${bw/2}" y="21" font-size="7.8">${lbl}</text></g></g>`;
});

const stage = document.getElementById('stage');
stage.innerHTML = svg;

const OPS = [
  { name: 'LdaSmi [21]', fn: s => { s.acc = 21; } },
  { name: 'Add r0, [0]', fn: s => { s.acc = s.acc + s.r0; } },
  { name: 'Star r0', fn: s => { s.r0 = s.acc; } },
  { name: 'Return (tier check)', fn: s => { s.warm++; } }
];
const st = { running: true, pc: 1, acc: 43, r0: 22, warm: 1 };
const $ = id => document.getElementById(id);
const keys = new Map([...stage.querySelectorAll('.press')].map(k => [k.dataset.k, k]));

function pulseMotor() {
  const m = $('starterMotor');
  m.style.transform = 'translateY(2.5px)';
  setTimeout(() => { m.style.transform = ''; }, 110);
}

function render() {
  $('starterMotor').classList.toggle('lit', st.running);
  for (let i = 0; i < 4; i++) {
    const inj = $('inj' + i);
    const active = st.running && st.pc === i;
    inj.classList.toggle('lit', active);
    inj.style.transform = active ? 'translateY(3px)' : '';
  }
  if (!st.running) {
    $('igVolt').textContent = '0.0V · RAIL DEPRESSURIZED (NO JIT)';
    $('igOp').textContent = 'BYTECODE HALTED · V8 CANNOT START';
    $('igRegs').textContent = 'acc = ' + st.acc + ' · r0 = ' + st.r0;
    $('readout').textContent = 'ignition off · 0 kPa · baseline required';
  } else {
    $('igVolt').textContent = '24.2V · RAIL 380 kPa · PC=0x0' + st.pc;
    $('igOp').textContent = 'FIRE INJ #' + (st.pc + 1) + ': ' + OPS[st.pc].name;
    $('igRegs').textContent = 'acc = ' + st.acc + ' · r0 = ' + st.r0 + ' · loops = ' + st.warm;
    $('readout').textContent = '24v on · inj #' + (st.pc + 1) + ' ' + INJS[st.pc][0] + ' · acc ' + st.acc + ' · warm ' + st.warm;
  }
  keys.get('crank').classList.toggle('sel', st.running);
}

function fire(idx) {
  st.running = true;
  st.pc = idx % 4;
  OPS[st.pc].fn(st);
  pulseMotor();
}

function act(k) {
  const el = keys.get(k);
  if (el) { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 110); }
  if (k === 'crank') { st.running = true; pulseMotor(); }
  else if (k === 'cut') { st.running = false; }
  else if (k === 'step') { fire((st.pc + 1) % 4); }
  else if (k === 'i0') fire(0);
  else if (k === 'i1') fire(1);
  else if (k === 'i2') fire(2);
  else if (k === 'i3') fire(3);
  render();
}

stage.addEventListener('pointerdown', e => { const el = e.target.closest('.press'); if (el) { e.preventDefault(); act(el.dataset.k); } });
const KM = { 'c':'crank', ' ':'step', 'Enter':'step', '1':'i0', '2':'i1', '3':'i2', '4':'i3', 'k':'cut', 'Escape':'cut' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KM[e.key] || KM[e.key.toLowerCase()];
  if (k) { e.preventDefault(); act(k); }
});
render();

</script>
</body>
</html>
