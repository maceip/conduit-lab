<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig 1 — v8::Isolate · Modular Factory Skid</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3e4347; --detail:#2a2d30; --body:#17181a; --deck:#1c1e21;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --kn:#232629; --kn-line:#565b5f; --ko:#d9dcde; --ko-line:#5a5f63; --ko-ink:#141618;
    --glass:#0a0b0c;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px; }
  html[data-embed="1"] body { background:transparent; padding:0; }
  html[data-embed="1"] main { max-width:none; }
  html[data-embed="1"] .foot-help { display:none; }
  html[data-embed="1"] svg { aspect-ratio: 6 / 5; }
  html[data-compact="1"] figure { padding:12px 14px; border-radius:12px; }
  html[data-compact="1"] .cap { font-size:10.5px; letter-spacing:.09em; }
  main { max-width:820px; margin-inline:auto; display:grid; gap:12px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:20px 24px; display:grid; gap:6px; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.13em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.04em; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  svg:focus-visible { outline:2px solid var(--live); outline-offset:4px; border-radius:8px; }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .struct { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .live-stroke { fill:none; stroke:var(--live); stroke-width:1.25; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .glass { fill:var(--glass); }
  .lcd { fill:var(--live); font-family:var(--mono); }
  .lcd-dim { fill:var(--ink); font-family:var(--mono); }
  .lbl { fill:var(--ink); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .lbl-hi { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press .face { fill:var(--kn); stroke:var(--kn-line); transition:stroke 90ms, fill 90ms; }
  .press.op .face { fill:var(--ko); stroke:var(--ko-line); }
  .press text { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press.op text { fill:var(--ko-ink); }
  .press.down { transform:translateY(4px); }
  .press.down .face, .press:hover .face.top, .press.sel .face { stroke:var(--live); }
  .press.sel text { fill:var(--live); }
  .press.op.sel text { fill:var(--ko-ink); }
  .unit { transition:transform 160ms cubic-bezier(.22,.8,.24,1); }
  .unit .face { transition:stroke 120ms, fill 120ms; }
  .unit.lit .face { stroke:var(--live); }
  .unit.lit .face.top { fill:var(--ko); }
  .unit.lit .lbl-hi { fill:var(--live); }
  .unit.lit .top-lbl { fill:var(--ko-ink); }
  .top-lbl { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .unit.mid .face { stroke:var(--kn-line); }
  .foot-help { margin:0; max-width:68ch; line-height:1.6; font-size:12px; }
  kbd { font:inherit; color:var(--ink-hi); border:1px solid var(--edge); border-radius:4px; padding:0 4px; }
  @media (prefers-reduced-motion:reduce){ .press, .unit { transition:none !important; } }
  
</style>
</head>
<body>
<main>
  <figure class="iso-plate">
    <div class="cap"><span class="hi">Fig 1</span><span>v8::Isolate · Modular Factory Skid</span></div>
    <svg id="stage" viewBox="0 0 589 503" tabindex="0" role="img" aria-label="Isometric v8::Isolate modular factory skid with forklift pockets, 4 GiB pointer-compression cage bollards, NEMA control cabinet, twin heap reservation tanks, and thread-lockout controls."></svg>
    <div class="cap"><span>lock thread · spawn realm · drain microtasks</span><span class="hi" id="readout" data-readout>thread #1 locked · 1 realm · cage 4096 MiB</span></div>
  </figure>
  <p class="foot-help">Controls: <kbd>1</kbd> lock Thread #1 · <kbd>2</kbd> contend Thread #2 · <kbd>U</kbd> unlock v8::Locker · <kbd>R</kbd> spawn Context/Realm · <kbd>M</kbd> enqueue microtask · <kbd>D</kbd> drain queue.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.documentElement.setAttribute("data-embed", "1");
  if (params.get("compact") === "1") document.documentElement.setAttribute("data-compact", "1");
  const qt = params.get("theme");
  if (qt === "light" || qt === "dark") document.documentElement.setAttribute("data-theme", qt);
  else document.documentElement.setAttribute("data-theme", "dark");
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "v8-iso-theme" && (ev.data.theme === "light" || ev.data.theme === "dark")) {
      document.documentElement.setAttribute("data-theme", ev.data.theme);
    }
  });
  if (params.get("embed") === "1" && window.parent && window.parent !== window) {
    const postH = () => {
      const f = document.querySelector("figure");
      if (f) window.parent.postMessage({ type: "v8-iso-height", id: params.get("id") || "fig-01-isolate", height: Math.ceil(f.getBoundingClientRect().height) }, "*");
    };
    new ResizeObserver(postH).observe(document.body);
    window.addEventListener("load", postH);
    setTimeout(postH, 60);
  }
})();

// ---- iso kernel (verbatim MrBongoC/ai-iso-skill) ----
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6), OX = 245, OY = 178;
const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V); return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
const TOP = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
const SIDE = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
const box = (x,y,z,w,d,h,r=0) => rect(SIDE(x+w,y+d,z+h),d,h,Math.min(r,h/4)) + rect(FRONT(x,y+d,z+h),w,h,Math.min(r,h/4)) + rect(TOP(x,y,z+h),w,d,r,'face top');


let svg = '';
// 1. Heavy structural steel Skid Base (340 x 226 x 18) with forklift pockets & floor deck grid
svg += box(0, 0, 0, 340, 226, 18, 4);
svg += `<g transform="${FRONT(0, 226, 18)}">
  <rect class="face glass" x="52" y="5" width="46" height="9" rx="1.5"/>
  <rect class="face glass" x="236" y="5" width="46" height="9" rx="1.5"/>
  ${Array.from({length:15},(_,i)=>`<path class="detail" d="M${14+i*22} 2v2"/>`).join('')}
</g>`;
svg += `<g transform="${SIDE(340, 226, 18)}">
  <rect class="face glass" x="48" y="5" width="40" height="9" rx="1.5"/>
  <rect class="face glass" x="138" y="5" width="40" height="9" rx="1.5"/>
</g>`;
// Checker-plate deck grid inside 4 GiB cage perimeter
svg += `<g transform="${TOP(0, 0, 18)}">
  <rect class="detail" x="10" y="10" width="320" height="206" rx="3"/>
  ${Array.from({length:7},(_,i)=>`<path class="detail" d="M10 ${36+i*26}h320"/>`).join('')}
  ${Array.from({length:9},(_,i)=>`<path class="detail" d="M${38+i*34} 10v206"/>`).join('')}
</g>`;

// 2. Back corner bollards (4 GiB Pointer-Compression Cage boundary)
svg += box(6, 6, 18, 10, 10, 96, 2);
svg += box(324, 6, 18, 10, 10, 96, 2);
// Back perimeter cage rail
svg += box(16, 8, 92, 308, 6, 6, 1);

// 3. Back-left NEMA VM Control & v8::Locker Cabinet
svg += box(20, 20, 18, 124, 66, 114, 5);
svg += `<g transform="${SIDE(144, 86, 132)}">
  ${Array.from({length:8},(_,i)=>`<path class="detail" d="M14 ${20+i*9}h38"/>`).join('')}
</g>`;
svg += `<g transform="${FRONT(20, 86, 132)}">
  <defs><clipPath id="isoScr"><rect x="10" y="10" width="104" height="58" rx="4"/></clipPath></defs>
  <rect class="face glass" x="10" y="10" width="104" height="58" rx="4"/>
  <g clip-path="url(#isoScr)">
    <text id="cabCage" class="lcd-dim" x="15" y="22" font-size="7.2">CAGE 0x2800_0000_0000</text>
    <text id="cabLock" class="lcd" x="15" y="35" font-size="8.5">LOCKER: THREAD #1</text>
    <text id="cabRealm" class="lcd-dim" x="15" y="48" font-size="7.5">REALMS: 1 · TASKS: 2</text>
    <text id="cabMsg" class="lcd" x="15" y="61" font-size="7.5">ISOLATE ENTERED</text>
  </g>
  <rect class="detail" x="10" y="76" width="104" height="28" rx="2"/>
  <path class="detail" d="M62 76v28"/>
  <circle class="struct" cx="55" cy="90" r="2.2"/>
  <circle class="struct" cx="69" cy="90" r="2.2"/>
</g>`;

// 4. Back-right Twin Heap Reservation Vessels (Code-Range & Old/New Cage Silos)
svg += box(160, 22, 18, 72, 64, 98, 6);
svg += `<g transform="${TOP(160, 22, 116)}">
  <circle class="struct" cx="36" cy="32" r="20"/>
  <circle class="detail" cx="36" cy="32" r="11"/>
</g>`;
svg += `<g transform="${FRONT(160, 86, 116)}">
  <rect class="face glass" x="28" y="10" width="16" height="58" rx="3"/>
  <rect id="tankBar1" fill="var(--live)" x="31" y="44" width="10" height="21" rx="1"/>
  <text class="lbl" x="36" y="78" font-size="6.6">HEAP 4G</text>
</g>`;

svg += box(244, 22, 18, 70, 64, 82, 6);
svg += `<g transform="${TOP(244, 22, 100)}">
  <circle class="struct" cx="35" cy="32" r="18"/>
  <circle class="detail" cx="35" cy="32" r="9"/>
</g>`;
svg += `<g transform="${FRONT(244, 86, 100)}">
  <rect class="face glass" x="27" y="10" width="16" height="46" rx="3"/>
  <rect id="tankBar2" fill="var(--live)" x="30" y="36" width="10" height="17" rx="1"/>
  <text class="lbl" x="35" y="66" font-size="6.6">REALMS</text>
</g>`;

// 5. Middle Microtask Pump Manifold + 4 Queue Stage Cells (y = 104..146)
svg += box(156, 102, 18, 160, 42, 22, 4);
for (let i = 0; i < 4; i++) {
  const qx = 166 + i * 37;
  svg += `<g class="unit" id="mtask${i}">${box(qx, 109, 40, 28, 28, 8, 2)}<g transform="${TOP(qx, 109, 48)}"><text x="14" y="17" font-size="7.2" class="top-lbl">Q${i+1}</text></g></g>`;
}

// 6. Front Operator Control Pedestal (y = 152..198, completely clear of front corner guards)
svg += box(18, 152, 18, 272, 46, 14, 4);
const BTNS = [
  ['t1', 'LOCK T1', 24, 44, true],
  ['t2', 'LOCK T2', 73, 44, false],
  ['unlock', 'UNLOCK', 122, 42, false],
  ['realm', '+REALM', 169, 40, false],
  ['enq', '+TASK', 214, 34, false],
  ['drain', 'DRAIN', 253, 32, true]
];
BTNS.forEach(([id, lbl, bx, bw, op]) => {
  svg += `<g class="press${op?' op':''}" data-k="${id}">${box(bx, 158, 32, bw, 30, 8, 3)}<g transform="${TOP(bx, 158, 40)}"><text x="${bw/2}" y="18.5" font-size="7">${lbl}</text></g></g>`;
});

// 7. Low front corner skid bumper bollards completing the 4 GiB cage perimeter
svg += box(6, 212, 18, 10, 10, 28, 2);
svg += box(324, 212, 18, 10, 10, 28, 2);

const stage = document.getElementById('stage');
stage.innerHTML = svg;

const st = { owner: 1, realms: 1, tasks: 2, msg: 'ISOLATE ENTERED (T1)', blocked: false };
const $ = id => document.getElementById(id);
const keys = new Map([...stage.querySelectorAll('.press')].map(k => [k.dataset.k, k]));

function render() {
  $('cabLock').textContent = st.owner ? 'LOCKER: THREAD #' + st.owner : 'LOCKER: UNLOCKED (IDLE)';
  $('cabRealm').textContent = 'REALMS: ' + st.realms + ' · QUEUE: ' + st.tasks + '/4';
  $('cabMsg').textContent = st.msg;
  const h1 = Math.min(50, 14 + st.realms * 8 + st.tasks * 3);
  $('tankBar1').setAttribute('y', String(65 - h1));
  $('tankBar1').setAttribute('height', String(h1));
  const h2 = Math.min(38, st.realms * 9);
  $('tankBar2').setAttribute('y', String(53 - h2));
  $('tankBar2').setAttribute('height', String(h2));

  for (let i = 0; i < 4; i++) {
    $('mtask' + i).classList.toggle('lit', i < st.tasks && st.owner !== 0);
    $('mtask' + i).classList.toggle('mid', i < st.tasks && st.owner === 0);
  }
  keys.get('t1').classList.toggle('sel', st.owner === 1);
  keys.get('t2').classList.toggle('sel', st.owner === 2);

  const lockStr = st.owner ? 'thread #' + st.owner + ' locked' : 'unlocked';
  $('readout').textContent = (st.blocked ? 'contended · ' : '') + lockStr + ' · ' + st.realms + (st.realms === 1 ? ' realm · ' : ' realms · ') + st.tasks + ' tasks';
}

function act(k) {
  const el = keys.get(k);
  if (el) { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 110); }
  st.blocked = false;
  if (k === 't1' || k === 't2') {
    const want = k === 't1' ? 1 : 2;
    if (st.owner !== 0 && st.owner !== want) {
      st.blocked = true;
      st.msg = 'DENIED: T' + st.owner + ' HOLDS v8::Locker';
    } else {
      st.owner = want;
      st.msg = 'ISOLATE ENTERED (T' + want + ')';
    }
  } else if (k === 'unlock') {
    st.owner = 0;
    st.msg = 'EXITED ISOLATE · IDLE';
  } else if (k === 'realm') {
    if (!st.owner) { st.blocked = true; st.msg = 'LOCK THREAD BEFORE ALLOC'; }
    else { st.realms = (st.realms % 4) + 1; st.msg = 'NEW v8::Context #' + st.realms; }
  } else if (k === 'enq') {
    if (!st.owner) { st.blocked = true; st.msg = 'LOCK THREAD TO ENQUEUE'; }
    else if (st.tasks < 4) { st.tasks++; st.msg = 'ENQUEUED PROMISE JOB #' + st.tasks; }
    else st.msg = 'MICROTASK RING FULL (4/4)';
  } else if (k === 'drain') {
    if (!st.owner) { st.blocked = true; st.msg = 'LOCK THREAD TO DRAIN'; }
    else { const n = st.tasks; st.tasks = 0; st.msg = 'DRAINED ' + n + ' MICROTASKS'; }
  }
  render();
}

stage.addEventListener('pointerdown', e => { const el = e.target.closest('.press'); if (el) { e.preventDefault(); act(el.dataset.k); } });
const KM = { '1':'t1', '2':'t2', 'u':'unlock', 'r':'realm', 'm':'enq', 'd':'drain', ' ':'drain' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KM[e.key] || KM[e.key.toLowerCase()];
  if (k) { e.preventDefault(); act(k); }
});
render();

</script>
</body>
</html>
