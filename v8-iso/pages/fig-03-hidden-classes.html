<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig 3 — Hidden Classes · Turret Punch & Indexed Dies</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3e4347; --detail:#2a2d30; --body:#17181a; --deck:#1c1e21;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --kn:#232629; --kn-line:#565b5f; --ko:#d9dcde; --ko-line:#5a5f63; --ko-ink:#141618;
    --glass:#0a0b0c;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px; }
  html[data-embed="1"] body { background:transparent; padding:0; }
  html[data-embed="1"] main { max-width:none; }
  html[data-embed="1"] .foot-help { display:none; }
  html[data-embed="1"] svg { aspect-ratio: 6 / 5; }
  html[data-compact="1"] figure { padding:12px 14px; border-radius:12px; }
  html[data-compact="1"] .cap { font-size:10.5px; letter-spacing:.09em; }
  main { max-width:820px; margin-inline:auto; display:grid; gap:12px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:20px 24px; display:grid; gap:6px; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.13em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.04em; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  svg:focus-visible { outline:2px solid var(--live); outline-offset:4px; border-radius:8px; }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .struct { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .live-stroke { fill:none; stroke:var(--live); stroke-width:1.25; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .glass { fill:var(--glass); }
  .lcd { fill:var(--live); font-family:var(--mono); }
  .lcd-dim { fill:var(--ink); font-family:var(--mono); }
  .lbl { fill:var(--ink); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .lbl-hi { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press .face { fill:var(--kn); stroke:var(--kn-line); transition:stroke 90ms, fill 90ms; }
  .press.op .face { fill:var(--ko); stroke:var(--ko-line); }
  .press text { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press.op text { fill:var(--ko-ink); }
  .press.down { transform:translateY(4px); }
  .press.down .face, .press:hover .face.top, .press.sel .face { stroke:var(--live); }
  .press.sel text { fill:var(--live); }
  .press.op.sel text { fill:var(--ko-ink); }
  .unit { transition:transform 160ms cubic-bezier(.22,.8,.24,1); }
  .unit .face { transition:stroke 120ms, fill 120ms; }
  .unit.lit .face { stroke:var(--live); }
  .unit.lit .face.top { fill:var(--ko); }
  .unit.lit .lbl-hi { fill:var(--live); }
  .unit.lit .top-lbl { fill:var(--ko-ink); }
  .top-lbl { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .unit.mid .face { stroke:var(--kn-line); }
  .foot-help { margin:0; max-width:68ch; line-height:1.6; font-size:12px; }
  kbd { font:inherit; color:var(--ink-hi); border:1px solid var(--edge); border-radius:4px; padding:0 4px; }
  @media (prefers-reduced-motion:reduce){ .press, .unit { transition:none !important; } }
  
</style>
</head>
<body>
<main>
  <figure class="iso-plate">
    <div class="cap"><span class="hi">Fig 3</span><span>Hidden Classes · Turret Punch & Indexed Dies</span></div>
    <svg id="stage" viewBox="0 0 603 543" tabindex="0" role="img" aria-label="Isometric automated turret punch press representing V8 HiddenClasses and Map transitions, with overhanging C-frame ram, rotary 4-die indexing turret, and front X-Y sheet clamp punching in-object property slots."></svg>
    <div class="cap"><span>punch fields · index map dies · test delete</span><span class="hi" id="readout" data-readout>map#2 {x@+4, y@+8} · die #2 · fast in-object</span></div>
  </figure>
  <p class="foot-help">Keys: <kbd>X</kbd> punch <code>+x (@+4)</code> · <kbd>Y</kbd> punch <code>+y (@+8)</code> · <kbd>Z</kbd> punch <code>+z (@+12)</code> · <kbd>D</kbd> delete property (degrades to dictionary mode) · <kbd>N</kbd> fresh JSObject blank.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.documentElement.setAttribute("data-embed", "1");
  if (params.get("compact") === "1") document.documentElement.setAttribute("data-compact", "1");
  const qt = params.get("theme");
  if (qt === "light" || qt === "dark") document.documentElement.setAttribute("data-theme", qt);
  else document.documentElement.setAttribute("data-theme", "dark");
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "v8-iso-theme" && (ev.data.theme === "light" || ev.data.theme === "dark")) {
      document.documentElement.setAttribute("data-theme", ev.data.theme);
    }
  });
  if (params.get("embed") === "1" && window.parent && window.parent !== window) {
    const postH = () => {
      const f = document.querySelector("figure");
      if (f) window.parent.postMessage({ type: "v8-iso-height", id: params.get("id") || "fig-03-hidden-classes", height: Math.ceil(f.getBoundingClientRect().height) }, "*");
    };
    new ResizeObserver(postH).observe(document.body);
    window.addEventListener("load", postH);
    setTimeout(postH, 60);
  }
})();

// ---- iso kernel (verbatim MrBongoC/ai-iso-skill) ----
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6), OX = 255, OY = 207;
const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V); return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
const TOP = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
const SIDE = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
const box = (x,y,z,w,d,h,r=0) => rect(SIDE(x+w,y+d,z+h),d,h,Math.min(r,h/4)) + rect(FRONT(x,y+d,z+h),w,h,Math.min(r,h/4)) + rect(TOP(x,y,z+h),w,d,r,'face top');


let svg = '';
// 1. Heavy Punch Press Bed (340 x 228 x 20)
svg += box(0, 8, 0, 340, 224, 20, 5);
// 2. Rear C-Frame Throat Column (x = 74, y = 0, z = 20..152)
svg += box(74, 0, 20, 118, 62, 132, 5);
svg += `<g transform="${SIDE(192, 62, 152)}">
  ${Array.from({length:7},(_,i)=>`<path class="detail" d="M12 ${22+i*12}h38"/>`).join('')}
</g>`;

// 3. Right Transition-Tree Readout Wing (x = 212, y = 14, z = 20..112)
svg += box(212, 14, 20, 116, 56, 92, 5);
svg += `<g transform="${FRONT(212, 70, 112)}">
  <defs><clipPath id="mapScr"><rect x="8" y="8" width="100" height="58" rx="4"/></clipPath></defs>
  <rect class="face glass" x="8" y="8" width="100" height="58" rx="4"/>
  <g clip-path="url(#mapScr)">
    <text id="mpHead" class="lcd" x="12" y="21" font-size="7.2">MAP#2 [FAST SLOTS]</text>
    <text id="mpTree" class="lcd-dim" x="13" y="34" font-size="7.5">M0 -&gt; +x@4 -&gt; +y@8</text>
    <text id="mpWord" class="lcd" x="13" y="48" font-size="7.8">HDR[0] = Map(0x0281)</text>
    <text id="mpMode" class="lcd-dim" x="13" y="60" font-size="7.2">DESC ARRAY: 2 ENTRIES</text>
  </g>
</g>`;

// 4. Rotary Indexed Die Turret Platter (x = 58, y = 66, z = 20..36)
svg += box(58, 66, 20, 150, 82, 16, 14);
svg += `<g transform="${TOP(58, 66, 36)}">
  <ellipse class="struct" cx="75" cy="41" rx="64" ry="34"/>
  <ellipse class="detail" cx="75" cy="41" rx="26" ry="14"/>
  <path class="detail" d="M11 41h128M75 7v68"/>
</g>`;

// 4 Indexed Hardened Die Stations around the turret (M0, +x, +y, +z)
const DIES = [
  ['die0', 'M0', 72, 74],
  ['die1', '+x', 152, 74],
  ['die2', '+y', 72, 112],
  ['die3', '+z', 152, 112]
];
DIES.forEach(([id, lbl, dx, dy]) => {
  svg += `<g class="unit" id="${id}">${box(dx, dy, 36, 36, 24, 11, 4)}<g transform="${TOP(dx, dy, 47)}"><text x="18" y="15" font-size="8" class="top-lbl">${lbl}</text></g></g>`;
});

// 5. Overhanging Cantilevered Ram Head + Moving Striker Cylinder (painted AFTER turret!)
svg += `<g class="unit" id="punchRam">${box(116, 86, 86, 34, 30, 30, 4)}</g>`;
svg += box(74, 0, 114, 118, 134, 42, 5);
svg += `<g transform="${FRONT(74, 134, 156)}">
  <rect class="detail" x="12" y="10" width="94" height="22" rx="3"/>
  <text class="lbl-hi" x="59" y="24" font-size="8.5">TURRET INDEXER · 20T</text>
</g>`;

// 6. Front X-Y Sheet-Clamp Worktable & Punched JSObject Blank (y = 152..184)
svg += box(26, 152, 20, 288, 32, 6, 2);
svg += `<g transform="${TOP(26, 152, 26)}">
  <!-- JSObject Metal Sheet Blank with Map word + 3 punchable in-object property slots -->
  <rect class="face" x="16" y="4" width="256" height="24" rx="2"/>
  <rect fill="var(--live)" x="22" y="7" width="52" height="18" rx="1.5"/>
  <text fill="var(--ko-ink)" x="48" y="19" font-size="7.8" text-anchor="middle" font-family="var(--mono)" id="sheetMapLbl">MAP#2</text>
  <rect id="slotBox1" class="face glass" x="82" y="7" width="56" height="18" rx="1.5"/>
  <text id="slotTxt1" class="lcd" x="110" y="19" font-size="7.5" text-anchor="middle">+4: x</text>
  <rect id="slotBox2" class="face glass" x="146" y="7" width="56" height="18" rx="1.5"/>
  <text id="slotTxt2" class="lcd" x="174" y="19" font-size="7.5" text-anchor="middle">+8: y</text>
  <rect id="slotBox3" class="face glass" x="210" y="7" width="56" height="18" rx="1.5"/>
  <text id="slotTxt3" class="lcd-dim" x="238" y="19" font-size="7.5" text-anchor="middle">unpunched</text>
</g>`;

// 7. Front Press Controls (y = 190..226)
const BTNS = [
  ['x', 'PUNCH +x', 24, 58, true],
  ['y', 'PUNCH +y', 88, 58, true],
  ['z', 'PUNCH +z', 152, 58, true],
  ['del', 'DELETE (DICT)', 216, 70, false],
  ['new', 'NEW', 292, 36, false]
];
BTNS.forEach(([id, lbl, bx, bw, op]) => {
  svg += `<g class="press${op?' op':''}" data-k="${id}">${box(bx, 190, 20, bw, 30, 8, 3)}<g transform="${TOP(bx, 190, 28)}"><text x="${bw/2}" y="19" font-size="7.6">${lbl}</text></g></g>`;
});

const stage = document.getElementById('stage');
stage.innerHTML = svg;

const st = { props: ['x', 'y'], dict: false };
const $ = id => document.getElementById(id);
const keys = new Map([...stage.querySelectorAll('.press')].map(k => [k.dataset.k, k]));

function strikeRam() {
  const ram = $('punchRam');
  ram.style.transform = 'translateY(8px)';
  ram.classList.add('lit');
  setTimeout(() => { ram.style.transform = ''; ram.classList.remove('lit'); }, 140);
}

function render() {
  const n = st.props.length;
  const activeDie = st.dict ? -1 : n;
  for (let i = 0; i < 4; i++) $('die' + i).classList.toggle('lit', i === activeDie);

  if (st.dict) {
    $('mpHead').textContent = 'DICT MODE [SLOW HASH]';
    $('mpTree').textContent = 'TRANSITION BROKEN (delete)';
    $('mpWord').textContent = 'HDR[0] = DictMap(0x09F1)';
    $('mpMode').textContent = 'NAME DICTIONARY BUCKETS';
    $('sheetMapLbl').textContent = 'DICT';
  } else {
    const chain = ['M0', ...st.props.map((p, i) => '+' + p + '@' + ((i + 1) * 4))].join(' -> ');
    $('mpHead').textContent = 'MAP#' + n + ' [FAST SLOTS]';
    $('mpTree').textContent = chain;
    $('mpWord').textContent = 'HDR[0] = Map(0x028' + n + ')';
    $('mpMode').textContent = 'DESC ARRAY: ' + n + (n === 1 ? ' ENTRY' : ' ENTRIES');
    $('sheetMapLbl').textContent = 'MAP#' + n;
  }

  [1, 2, 3].forEach(idx => {
    const p = st.props[idx - 1];
    const txt = $('slotTxt' + idx);
    if (st.dict) {
      txt.textContent = p ? ('hash:' + p) : 'hole';
      txt.setAttribute('class', p ? 'lcd' : 'lcd-dim');
    } else if (p) {
      txt.textContent = '+' + (idx * 4) + ': ' + p;
      txt.setAttribute('class', 'lcd');
    } else {
      txt.textContent = 'blank';
      txt.setAttribute('class', 'lcd-dim');
    }
  });

  $('readout').textContent = st.dict
    ? 'dictionary map · slow hash table · ' + n + ' props'
    : 'map#' + n + ' {' + (st.props.map((p, i) => p + '@+' + ((i + 1) * 4)).join(', ') || 'empty') + '} · die #' + n;
}

function act(k) {
  const el = keys.get(k);
  if (el) { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 110); }
  if (k === 'new') { st.props = []; st.dict = false; strikeRam(); }
  else if (k === 'del') { st.props.pop(); st.dict = true; strikeRam(); }
  else if (['x', 'y', 'z'].includes(k)) {
    if (!st.props.includes(k) && st.props.length < 3) { st.props.push(k); strikeRam(); }
  }
  render();
}

stage.addEventListener('pointerdown', e => { const el = e.target.closest('.press'); if (el) { e.preventDefault(); act(el.dataset.k); } });
const KM = { 'x':'x', 'y':'y', 'z':'z', 'd':'del', 'Backspace':'del', 'n':'new', 'Escape':'new' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KM[e.key] || KM[e.key.toLowerCase()];
  if (k) { e.preventDefault(); act(k); }
});
render();

</script>
</body>
</html>
