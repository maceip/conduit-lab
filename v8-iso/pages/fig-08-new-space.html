<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig 8 — Orinoco New Space · Eddy-Current Chip Separator</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3e4347; --detail:#2a2d30; --body:#17181a; --deck:#1c1e21;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --kn:#232629; --kn-line:#565b5f; --ko:#d9dcde; --ko-line:#5a5f63; --ko-ink:#141618;
    --glass:#0a0b0c;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px; }
  html[data-embed="1"] body { background:transparent; padding:0; }
  html[data-embed="1"] main { max-width:none; }
  html[data-embed="1"] .foot-help { display:none; }
  html[data-embed="1"] svg { aspect-ratio: 6 / 5; }
  html[data-compact="1"] figure { padding:12px 14px; border-radius:12px; }
  html[data-compact="1"] .cap { font-size:10.5px; letter-spacing:.09em; }
  main { max-width:820px; margin-inline:auto; display:grid; gap:12px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:20px 24px; display:grid; gap:6px; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.13em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.04em; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  svg:focus-visible { outline:2px solid var(--live); outline-offset:4px; border-radius:8px; }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .struct { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .live-stroke { fill:none; stroke:var(--live); stroke-width:1.25; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .glass { fill:var(--glass); }
  .lcd { fill:var(--live); font-family:var(--mono); }
  .lcd-dim { fill:var(--ink); font-family:var(--mono); }
  .lbl { fill:var(--ink); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .lbl-hi { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press .face { fill:var(--kn); stroke:var(--kn-line); transition:stroke 90ms, fill 90ms; }
  .press.op .face { fill:var(--ko); stroke:var(--ko-line); }
  .press text { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press.op text { fill:var(--ko-ink); }
  .press.down { transform:translateY(4px); }
  .press.down .face, .press:hover .face.top, .press.sel .face { stroke:var(--live); }
  .press.sel text { fill:var(--live); }
  .press.op.sel text { fill:var(--ko-ink); }
  .unit { transition:transform 160ms cubic-bezier(.22,.8,.24,1); }
  .unit .face { transition:stroke 120ms, fill 120ms; }
  .unit.lit .face { stroke:var(--live); }
  .unit.lit .face.top { fill:var(--ko); }
  .unit.lit .lbl-hi { fill:var(--live); }
  .unit.lit .top-lbl { fill:var(--ko-ink); }
  .top-lbl { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .unit.mid .face { stroke:var(--kn-line); }
  .foot-help { margin:0; max-width:68ch; line-height:1.6; font-size:12px; }
  kbd { font:inherit; color:var(--ink-hi); border:1px solid var(--edge); border-radius:4px; padding:0 4px; }
  @media (prefers-reduced-motion:reduce){ .press, .unit { transition:none !important; } }
  
</style>
</head>
<body>
<main>
  <figure class="iso-plate">
    <div class="cap"><span class="hi">Fig 8</span><span>Orinoco New Space · Eddy-Current Chip Separator</span></div>
    <svg id="stage" viewBox="0 0 626 527" tabindex="0" role="img" aria-label="Isometric dual-belt eddy-current chip separator for V8 Orinoco New Space Scavenger: elevated From-Space belt, magnetic eddy-current drum, zero-cost dead-chip gravity chute, lower To-Space survivor belt, and Old-Space promotion elevator."></svg>
    <div class="cap"><span>feed nursery · pulse eddy rotor · promote age 2</span><span class="hi" id="readout" data-readout>scavenger · 2 to-space / 4 dropped · 1 promoted</span></div>
  </figure>
  <p class="foot-help">Keys: <kbd>F</kbd> feed Nursery allocation · <kbd>D</kbd> die young (mark batch unreachable) · <kbd>Space</kbd> or <kbd>S</kbd> scavenge pulse · <kbd>P</kbd> promote age-2 survivors to Old Space · <kbd>Esc</kbd> reset.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.documentElement.setAttribute("data-embed", "1");
  if (params.get("compact") === "1") document.documentElement.setAttribute("data-compact", "1");
  const qt = params.get("theme");
  if (qt === "light" || qt === "dark") document.documentElement.setAttribute("data-theme", qt);
  else document.documentElement.setAttribute("data-theme", "dark");
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "v8-iso-theme" && (ev.data.theme === "light" || ev.data.theme === "dark")) {
      document.documentElement.setAttribute("data-theme", ev.data.theme);
    }
  });
  if (params.get("embed") === "1" && window.parent && window.parent !== window) {
    const postH = () => {
      const f = document.querySelector("figure");
      if (f) window.parent.postMessage({ type: "v8-iso-height", id: params.get("id") || "fig-08-new-space", height: Math.ceil(f.getBoundingClientRect().height) }, "*");
    };
    new ResizeObserver(postH).observe(document.body);
    window.addEventListener("load", postH);
    setTimeout(postH, 60);
  }
})();

// ---- iso kernel (verbatim MrBongoC/ai-iso-skill) ----
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6), OX = 224, OY = 182;
const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V); return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
const TOP = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
const SIDE = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
const box = (x,y,z,w,d,h,r=0) => rect(SIDE(x+w,y+d,z+h),d,h,Math.min(r,h/4)) + rect(FRONT(x,y+d,z+h),w,h,Math.min(r,h/4)) + rect(TOP(x,y,z+h),w,d,r,'face top');


let svg = '';
// 1. Separator Plant Floor Frame (400 x 194 x 12)
svg += box(0, 0, 0, 400, 194, 12, 4);

// 2. Back-Left Scavenger Telemetry Unit (x = 14, y = 8, z = 12..132)
svg += box(14, 8, 12, 152, 30, 120, 4);
svg += `<g transform="${FRONT(14, 38, 132)}">
  <defs><clipPath id="scvScr"><rect x="8" y="8" width="136" height="44" rx="3"/></clipPath></defs>
  <rect class="face glass" x="8" y="8" width="136" height="44" rx="3"/>
  <g clip-path="url(#scvScr)">
    <text id="scvHead" class="lcd" x="13" y="21" font-size="7.8">CHENEY SEMI-SPACE SCAVENGER</text>
    <text id="scvSub" class="lcd-dim" x="13" y="34" font-size="7.4">DEAD DROP = 0 CYC · COPY LIVE</text>
    <text id="scvCounts" class="lcd" x="13" y="46" font-size="7.8">TO: 2 · DROPPED: 4 · OLD: 1</text>
  </g>
</g>`;

// 3. Upper-Left From-Space Trestle + Elevated Feeder Conveyor Belt (x = 14..186, y = 48..112, z = 12..86)
svg += box(24, 54, 12, 20, 52, 60, 2);
svg += box(136, 54, 12, 20, 52, 60, 2);
svg += box(12, 48, 72, 174, 64, 14, 5);
svg += `<g transform="${TOP(12, 48, 86)}">
  ${Array.from({length:8},(_,i)=>`<path class="detail" d="M${16+i*20} 6v52"/>`).join('')}
  <text class="lbl" x="87" y="58" font-size="6.8">FROM-SPACE NURSERY</text>
</g>`;
// 3 Nursery Chip Allocations sitting on Upper From-Space Belt
for (let i = 0; i < 3; i++) {
  const cx = 28 + i * 46;
  svg += `<g class="unit" id="fromChip${i}">${box(cx, 64, 86, 32, 28, 10, 2)}<g transform="${TOP(cx, 64, 96)}"><text id="fromTxt${i}" x="16" y="17" font-size="6.8" class="top-lbl">NEW</text></g></g>`;
}

// 4. Central Dead-Chip Gravity Drop Bin (directly beneath drum at z = 12..48)
svg += box(172, 50, 12, 62, 62, 36, 3);
svg += `<g transform="${FRONT(172, 112, 48)}"><text id="dropBinTxt" class="lbl-hi" x="31" y="21" font-size="7.2">4 DROPPED</text></g>`;

// 5. Eddy-Current Magnetic Rotor Drum Housing (x = 178..232, y = 44..116, z = 58..102)
svg += `<g class="unit lit" id="eddyDrum">
  ${box(178, 44, 58, 54, 72, 44, 7)}
  <g transform="${FRONT(178, 116, 102)}">
    <circle class="struct" cx="27" cy="22" r="15"/>
    <path id="rotorCross" class="live-stroke" d="M15 22h24M27 10v24"/>
  </g>
</g>`;

// 6. Lower-Right To-Space Survivor Belt (x = 240..348, y = 52..110, z = 12..38) + Far-Right Old-Space Elevator
svg += box(240, 52, 12, 108, 58, 26, 4);
svg += `<g transform="${TOP(240, 52, 38)}">
  ${Array.from({length:5},(_,i)=>`<path class="detail" d="M${16+i*20} 6v46"/>`).join('')}
</g>`;
// 2 Survivor Chips leaping onto To-Space Belt
for (let i = 0; i < 2; i++) {
  const sx = 248 + i * 44;
  svg += `<g class="unit lit" id="toChip${i}">${box(sx, 66, 38, 34, 30, 11, 2)}<g transform="${TOP(sx, 66, 49)}"><text id="toTxt${i}" x="17" y="18" font-size="6.8" class="top-lbl">AGE 1</text></g></g>`;
}
// Far-Right Old-Space Promotion Elevator Tower (x = 358..396, y = 46..114, z = 12..114)
svg += box(358, 46, 12, 38, 68, 102, 4);
svg += `<g transform="${FRONT(358, 114, 114)}">
  <rect class="face glass" x="6" y="12" width="26" height="58" rx="2"/>
  <text id="promoTxt" class="lcd" x="19" y="44" font-size="8.5" text-anchor="middle">1</text>
  <text class="lbl" x="19" y="84" font-size="6.2">OLD</text>
</g>`;

// 7. Front Operator Bar (y = 138..182)
const BTNS = [
  ['feed', 'FEED NURSERY', 16, 84, false],
  ['die', 'DIE YOUNG', 106, 74, false],
  ['scav', 'SCAVENGE PULSE', 186, 98, true],
  ['promo', 'PROMOTE', 290, 60, true],
  ['rst', 'CLR', 356, 34, false]
];
BTNS.forEach(([id, lbl, bx, bw, op]) => {
  svg += `<g class="press${op?' op':''}" data-k="${id}">${box(bx, 140, 12, bw, 36, 8, 3)}<g transform="${TOP(bx, 140, 20)}"><text x="${bw/2}" y="21" font-size="7.4">${lbl}</text></g></g>`;
});

const stage = document.getElementById('stage');
stage.innerHTML = svg;

const st = {
  nursery: [{ live: true }, { live: false }, { live: true }],
  toSpace: [{ age: 1 }, { age: 2 }],
  dropped: 4,
  promoted: 1,
  spin: false
};
const $ = id => document.getElementById(id);
const keys = new Map([...stage.querySelectorAll('.press')].map(k => [k.dataset.k, k]));

function flashDrum() {
  const d = $('eddyDrum');
  d.style.transform = 'translateY(-3px)';
  st.spin = !st.spin;
  $('rotorCross').setAttribute('d', st.spin ? 'M17 12l20 20M37 12l-20 20' : 'M15 22h24M27 10v24');
  setTimeout(() => { d.style.transform = ''; }, 130);
}

function render() {
  for (let i = 0; i < 3; i++) {
    const c = st.nursery[i], el = $('fromChip' + i), t = $('fromTxt' + i);
    if (!c) el.style.display = 'none';
    else {
      el.style.display = '';
      el.classList.toggle('lit', c.live);
      t.textContent = c.live ? 'ROOT' : 'DEAD';
    }
  }
  for (let i = 0; i < 2; i++) {
    const s = st.toSpace[i], el = $('toChip' + i), t = $('toTxt' + i);
    if (!s) el.style.display = 'none';
    else {
      el.style.display = '';
      t.textContent = 'AGE ' + s.age;
    }
  }
  $('dropBinTxt').textContent = st.dropped + ' DROPPED';
  $('promoTxt').textContent = String(st.promoted);
  $('scvCounts').textContent = 'TO: ' + st.toSpace.length + ' · DROPPED: ' + st.dropped + ' · OLD: ' + st.promoted;
  $('readout').textContent = 'scavenger · ' + st.toSpace.length + ' to-space / ' + st.dropped + ' dropped · ' + st.promoted + ' promoted';
}

function act(k) {
  const el = keys.get(k);
  if (el) { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 110); }
  if (k === 'feed') {
    st.nursery = [{ live: true }, { live: false }, { live: (st.dropped % 2) === 0 }];
  } else if (k === 'die') {
    st.nursery.forEach((c, idx) => { if (c && idx > 0) c.live = false; });
  } else if (k === 'scav') {
    flashDrum();
    const survivors = [];
    st.nursery.forEach(c => {
      if (!c) return;
      if (c.live) survivors.push({ age: 1 });
      else st.dropped++;
    });
    st.nursery = [null, null, null];
    st.toSpace = [...st.toSpace.map(s => ({ age: s.age + 1 })), ...survivors];
    // Auto-promote any age >= 2 if more than 2 on belt
    while (st.toSpace.length > 2) {
      st.toSpace.shift();
      st.promoted++;
    }
  } else if (k === 'promo') {
    const kept = [];
    st.toSpace.forEach(s => {
      if (s.age >= 2 || kept.length >= 1) st.promoted++;
      else kept.push({ age: s.age + 1 });
    });
    st.toSpace = kept;
  } else if (k === 'rst') {
    st.nursery = [{ live: true }, { live: false }, { live: false }];
    st.toSpace = [];
    st.dropped = 0;
    st.promoted = 0;
  }
  render();
}

stage.addEventListener('pointerdown', e => { const el = e.target.closest('.press'); if (el) { e.preventDefault(); act(el.dataset.k); } });
const KM = { 'f':'feed', 'd':'die', 's':'scav', ' ':'scav', 'Enter':'scav', 'p':'promo', 'Escape':'rst' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KM[e.key] || KM[e.key.toLowerCase()];
  if (k) { e.preventDefault(); act(k); }
});
render();

</script>
</body>
</html>
