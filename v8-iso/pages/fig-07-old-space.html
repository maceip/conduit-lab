<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig 7 — Orinoco Old Space · AS/RS High-Bay Warehouse</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3e4347; --detail:#2a2d30; --body:#17181a; --deck:#1c1e21;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --kn:#232629; --kn-line:#565b5f; --ko:#d9dcde; --ko-line:#5a5f63; --ko-ink:#141618;
    --glass:#0a0b0c;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8b9095; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#5f6468; --ink-hi:#16181a; --live:#0c0d0e;
    --kn:#ffffff; --kn-line:#7b8084; --ko:#242628; --ko-line:#0c0d0e; --ko-ink:#f4f5f5;
    --glass:#e1e3e3;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px; }
  html[data-embed="1"] body { background:transparent; padding:0; }
  html[data-embed="1"] main { max-width:none; }
  html[data-embed="1"] .foot-help { display:none; }
  html[data-embed="1"] svg { aspect-ratio: 6 / 5; }
  html[data-compact="1"] figure { padding:12px 14px; border-radius:12px; }
  html[data-compact="1"] .cap { font-size:10.5px; letter-spacing:.09em; }
  main { max-width:820px; margin-inline:auto; display:grid; gap:12px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:20px 24px; display:grid; gap:6px; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; font-size:12px; text-transform:uppercase; letter-spacing:.13em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.04em; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  svg:focus-visible { outline:2px solid var(--live); outline-offset:4px; border-radius:8px; }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .struct { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .live-stroke { fill:none; stroke:var(--live); stroke-width:1.25; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .glass { fill:var(--glass); }
  .lcd { fill:var(--live); font-family:var(--mono); }
  .lcd-dim { fill:var(--ink); font-family:var(--mono); }
  .lbl { fill:var(--ink); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .lbl-hi { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press .face { fill:var(--kn); stroke:var(--kn-line); transition:stroke 90ms, fill 90ms; }
  .press.op .face { fill:var(--ko); stroke:var(--ko-line); }
  .press text { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .press.op text { fill:var(--ko-ink); }
  .press.down { transform:translateY(4px); }
  .press.down .face, .press:hover .face.top, .press.sel .face { stroke:var(--live); }
  .press.sel text { fill:var(--live); }
  .press.op.sel text { fill:var(--ko-ink); }
  .unit { transition:transform 160ms cubic-bezier(.22,.8,.24,1); }
  .unit .face { transition:stroke 120ms, fill 120ms; }
  .unit.lit .face { stroke:var(--live); }
  .unit.lit .face.top { fill:var(--ko); }
  .unit.lit .lbl-hi { fill:var(--live); }
  .unit.lit .top-lbl { fill:var(--ko-ink); }
  .top-lbl { fill:var(--ink-hi); font-family:var(--mono); text-anchor:middle; pointer-events:none; }
  .unit.mid .face { stroke:var(--kn-line); }
  .foot-help { margin:0; max-width:68ch; line-height:1.6; font-size:12px; }
  kbd { font:inherit; color:var(--ink-hi); border:1px solid var(--edge); border-radius:4px; padding:0 4px; }
  @media (prefers-reduced-motion:reduce){ .press, .unit { transition:none !important; } }
  
</style>
</head>
<body>
<main>
  <figure class="iso-plate">
    <div class="cap"><span class="hi">Fig 7</span><span>Orinoco Old Space · AS/RS High-Bay Warehouse</span></div>
    <svg id="stage" viewBox="0 0 649 610" tabindex="0" role="img" aria-label="Isometric tall AS/RS high-bay warehouse rack with 12 three-dimensional Old-Space memory pallets, a traveling stacker-crane mast with vertical laser inventory scanner, and mark-sweep-compact controls."></svg>
    <div class="cap"><span>laser-mark rack · sweep white · compact bays</span><span class="hi" id="readout" data-readout>as/rs rack · 6 live / 3 dead · 25% frag</span></div>
  </figure>
  <p class="foot-help">Keys: <kbd>A</kbd> store Old-Space pallet · <kbd>U</kbd> orphan a pallet (unroot) · <kbd>L</kbd> laser tricolor mark · <kbd>S</kbd> sweep white pallets · <kbd>C</kbd> compact high-bay rack.</p>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("embed") === "1") document.documentElement.setAttribute("data-embed", "1");
  if (params.get("compact") === "1") document.documentElement.setAttribute("data-compact", "1");
  const qt = params.get("theme");
  if (qt === "light" || qt === "dark") document.documentElement.setAttribute("data-theme", qt);
  else document.documentElement.setAttribute("data-theme", "dark");
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "v8-iso-theme" && (ev.data.theme === "light" || ev.data.theme === "dark")) {
      document.documentElement.setAttribute("data-theme", ev.data.theme);
    }
  });
  if (params.get("embed") === "1" && window.parent && window.parent !== window) {
    const postH = () => {
      const f = document.querySelector("figure");
      if (f) window.parent.postMessage({ type: "v8-iso-height", id: params.get("id") || "fig-07-old-space", height: Math.ceil(f.getBoundingClientRect().height) }, "*");
    };
    new ResizeObserver(postH).observe(document.body);
    window.addEventListener("load", postH);
    setTimeout(postH, 60);
  }
})();

// ---- iso kernel (verbatim MrBongoC/ai-iso-skill) ----
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6), OX = 226, OY = 247;
const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V); return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
const TOP = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
const SIDE = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
const box = (x,y,z,w,d,h,r=0) => rect(SIDE(x+w,y+d,z+h),d,h,Math.min(r,h/4)) + rect(FRONT(x,y+d,z+h),w,h,Math.min(r,h/4)) + rect(TOP(x,y,z+h),w,d,r,'face top');


let svg = '';
// 1. Warehouse Floor Slab (424 x 194 x 14)
svg += box(0, 0, 0, 424, 194, 14, 4);

// 2. Tall 4-Col x 3-Tier AS/RS High-Bay Storage Rack (x = 18..266, y = 12..64, z = 14..180)
// Back Uprights first, then strictly tier-by-tier (shelf -> pallets) for true painter's order!
for (let c = 0; c <= 4; c++) { svg += box(18 + c * 60, 12, 14, 8, 10, 166, 1); }
for (let tier = 0; tier < 3; tier++) {
  svg += box(18, 12, 14 + tier * 52, 248, 52, 6, 1);
  for (let col = 0; col < 4; col++) {
    const idx = tier * 4 + col;
    const px = 30 + col * 60, py = 20, pz = 20 + tier * 52;
    svg += `<g class="unit" id="bay${idx}">
      ${box(px, py, pz, 42, 38, 30, 3)}
      <g transform="${FRONT(px, py + 38, pz + 30)}"><text id="bayTxt${idx}" x="21" y="18" font-size="7.2" class="lbl-hi">LIVE</text></g>
    </g>`;
  }
}
// Top Rack Cap Shelf + Front Upright Columns
svg += box(18, 12, 170, 248, 52, 6, 1);
for (let c = 0; c <= 4; c++) { svg += box(18 + c * 60, 56, 14, 8, 8, 162, 1); }

// 3. Right WMS Inventory & Compaction Control Tower (x = 318..410, completely clear of col 3!)
svg += box(318, 28, 14, 92, 96, 118, 5);
svg += `<g transform="${FRONT(318, 124, 132)}">
  <defs><clipPath id="whScr"><rect x="8" y="10" width="76" height="72" rx="4"/></clipPath></defs>
  <rect class="face glass" x="8" y="10" width="76" height="72" rx="4"/>
  <g clip-path="url(#whScr)">
    <text class="lcd-dim" x="13" y="23" font-size="7">OLD-SPACE WMS</text>
    <text id="whLive" class="lcd" x="13" y="37" font-size="8">BLACK: 6 BAYS</text>
    <text id="whDead" class="lcd-dim" x="13" y="50" font-size="7.5">WHITE: 3 BAYS</text>
    <text id="whFrag" class="lcd" x="13" y="64" font-size="7.8">FRAG: 25%</text>
    <text id="whPhase" class="lcd-dim" x="13" y="76" font-size="6.8">READY</text>
  </g>
</g>`;

// 4. AS/RS Crane Floor Guide Rail + Traveling Vertical Mast & Laser Scanner Carriage (y = 82..114)
svg += box(16, 86, 14, 254, 16, 5, 2);
svg += `<g class="unit" id="craneMast">
  ${box(38, 80, 19, 28, 28, 10, 2)}
  ${box(47, 89, 29, 10, 10, 158, 2)}
  <g class="unit lit" id="laserCarriage">
    ${box(34, 74, 72, 36, 26, 18, 3)}
    <g transform="${FRONT(34, 100, 90)}"><text x="18" y="12" font-size="6.2" class="lbl-hi">LASER</text></g>
  </g>
</g>`;

// 5. Front Warehouse Dock Keypad (y = 140..182)
const BTNS = [
  ['alloc', '+PALLET', 18, 62, false],
  ['drop', 'UNROOT', 86, 62, false],
  ['mark', 'LASER MARK', 154, 76, true],
  ['sweep', 'SWEEP', 236, 58, false],
  ['compact', 'COMPACT', 300, 68, true]
];
BTNS.forEach(([id, lbl, bx, bw, op]) => {
  svg += `<g class="press${op?' op':''}" data-k="${id}">${box(bx, 142, 14, bw, 36, 8, 3)}<g transform="${TOP(bx, 142, 22)}"><text x="${bw/2}" y="21" font-size="7.5">${lbl}</text></g></g>`;
});

const stage = document.getElementById('stage');
stage.innerHTML = svg;

// 12 bays: null = empty, { root: bool, marked: bool }
const st = {
  bays: [
    { root: true, marked: true }, null, { root: false, marked: false }, { root: true, marked: true },
    { root: true, marked: true }, { root: false, marked: false }, { root: true, marked: true }, null,
    { root: false, marked: false }, { root: true, marked: true }, null, { root: true, marked: true }
  ],
  craneCol: 1,
  craneTier: 1,
  phase: 'READY'
};
const $ = id => document.getElementById(id);
const keys = new Map([...stage.querySelectorAll('.press')].map(k => [k.dataset.k, k]));

function render() {
  // Move AS/RS Crane along aisle (+x) and Laser Shuttle vertically (-z)
  const dx = st.craneCol * 60;
  const mastPt = [dx * Math.cos(Math.PI/6), dx * Math.sin(Math.PI/6)];
  $('craneMast').style.transform = `translate(${mastPt[0].toFixed(1)}px, ${mastPt[1].toFixed(1)}px)`;
  $('laserCarriage').style.transform = `translateY(${((1 - st.craneTier) * 52).toFixed(1)}px)`;

  let live = 0, dead = 0, holes = 0, lastUsed = -1;
  st.bays.forEach((b, idx) => {
    const el = $('bay' + idx), txt = $('bayTxt' + idx);
    if (!b) {
      el.style.display = 'none';
    } else {
      el.style.display = '';
      lastUsed = idx;
      if (b.root) live++; else dead++;
      const isBlack = b.root && b.marked;
      el.classList.toggle('lit', isBlack);
      el.classList.toggle('mid', !isBlack);
      txt.textContent = isBlack ? 'BLACK' : (b.root ? 'ROOT' : 'WHITE');
    }
  });
  for (let i = 0; i < lastUsed; i++) if (!st.bays[i]) holes++;
  const frag = lastUsed >= 0 ? Math.round((holes / (lastUsed + 1)) * 100) : 0;

  $('whLive').textContent = 'LIVE: ' + live + ' BAYS';
  $('whDead').textContent = 'WHITE: ' + dead + ' BAYS';
  $('whFrag').textContent = 'FRAG: ' + frag + '%';
  $('whPhase').textContent = st.phase;
  $('readout').textContent = st.phase.toLowerCase() + ' · ' + live + ' live / ' + dead + ' dead · ' + frag + '% frag';
}

function act(k) {
  const el = keys.get(k);
  if (el) { el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 110); }
  if (k === 'alloc') {
    const idx = st.bays.findIndex(b => b === null);
    if (idx >= 0) {
      st.bays[idx] = { root: true, marked: false };
      st.craneCol = idx % 4; st.craneTier = Math.floor(idx / 4);
      st.phase = 'STORED BAY #' + idx;
    } else st.phase = 'RACK FULL (12/12)';
  } else if (k === 'drop') {
    const idx = st.bays.findIndex(b => b && b.root);
    if (idx >= 0) {
      st.bays[idx].root = false; st.bays[idx].marked = false;
      st.craneCol = idx % 4; st.craneTier = Math.floor(idx / 4);
      st.phase = 'UNROOTED BAY #' + idx;
    }
  } else if (k === 'mark') {
    st.bays.forEach(b => { if (b) b.marked = b.root; });
    st.craneCol = (st.craneCol + 1) % 4;
    st.craneTier = (st.craneTier + 1) % 3;
    st.phase = 'LASER MARKED';
  } else if (k === 'sweep') {
    let freed = 0;
    st.bays = st.bays.map(b => {
      if (b && !b.root) { freed++; return null; }
      return b;
    });
    st.craneCol = 2; st.craneTier = 0;
    st.phase = 'SWEPT ' + freed + ' WHITE';
  } else if (k === 'compact') {
    const survivors = st.bays.filter(b => b && b.root).map(b => ({ root: true, marked: true }));
    while (survivors.length < 12) survivors.push(null);
    st.bays = survivors;
    st.craneCol = Math.max(0, (survivors.filter(Boolean).length - 1) % 4);
    st.craneTier = 0;
    st.phase = 'COMPACTED 0% FRAG';
  }
  render();
}

stage.addEventListener('pointerdown', e => { const el = e.target.closest('.press'); if (el) { e.preventDefault(); act(el.dataset.k); } });
const KM = { 'a':'alloc', 'u':'drop', 'l':'mark', 'm':'mark', 's':'sweep', 'c':'compact', ' ':'compact' };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = KM[e.key] || KM[e.key.toLowerCase()];
  if (k) { e.preventDefault(); act(k); }
});
render();

</script>
</body>
</html>
